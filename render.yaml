# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Os segredos têm "sync: false": o Render pede o valor no painel e ele nunca fica no git.
services:
  - type: web
    name: porganization-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Mesma região do Supabase (us-east-1, Virgínia): menor latência entre a API e o banco
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    # Mudanças só no frontend não refazem o deploy da API
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase > Connect > Session pooler (porta 5432):
      # jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # postgres.<ref-do-projeto>
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # https://<ref-do-projeto>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWKS_URI
        sync: false
      # https://<ref-do-projeto>.supabase.co/auth/v1
      - key: SUPABASE_ISSUER
        sync: false
      # URL do frontend na Vercel, ex.: https://porganization.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Segredo do header X-Cron-Secret que o cron externo manda para /internal/reminders/dispatch
      - key: CRON_SECRET
        generateValue: true
      # URL do app na Vercel (links dos e-mails e notificações)
      - key: APP_URL
        sync: false
      # SMTP dos lembretes por e-mail; sem MAIL_HOST, o e-mail fica desligado
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Web Push: par de chaves VAPID (npx web-push generate-vapid-keys) e contato mailto:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Google Calendar: OAuth client do Google Cloud e a chave que cifra os tokens (openssl rand -base64 32)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://porganization-api.onrender.com/api/integrations/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_KEY
        sync: false
