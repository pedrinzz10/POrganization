name: segredos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    name: segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check-secrets nos arquivos rastreados
        run: bash scripts/check-secrets.sh

      - name: testes do check-secrets e do hook
        run: bash scripts/test-check-secrets.sh

      - name: gitleaks no histórico inteiro
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
