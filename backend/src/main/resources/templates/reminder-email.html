<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Lembrete</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#1f1f24;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
        <td style="padding:24px;">
            <p style="margin:0 0 4px;font-size:12px;color:#6b6b76;text-transform:uppercase;letter-spacing:1px;">POrganization</p>
            <h1 style="margin:0 0 16px;font-size:20px;" th:text="${subject}">Lembrete: Dentista às 15:00</h1>
            <p style="margin:0 0 8px;font-size:15px;" th:each="line : ${lines}" th:text="${line}">quinta-feira, 1 de outubro às 15:00</p>
            <p style="margin:24px 0 0;">
                <a th:href="${link}" href="#"
                   style="display:inline-block;padding:10px 18px;background:#3f51b5;color:#ffffff;text-decoration:none;border-radius:8px;">Abrir o app</a>
            </p>
        </td>
    </tr>
</table>
<p style="max-width:480px;margin:12px auto 0;font-size:12px;color:#6b6b76;text-align:center;">
    Você recebe este e-mail porque ativou lembretes por e-mail no POrganization.
</p>
</body>
</html>
