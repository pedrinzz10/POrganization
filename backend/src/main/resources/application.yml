server:
  # O Render define PORT; localmente fica 8080
  port: ${PORT:8080}

spring:
  application:
    name: porganization
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # O Supabase já cria objetos no schema public (ex.: a função rls_auto_enable, do "RLS automático").
    # Sem histórico do Flyway, ele faz baseline na versão 0 e aplica todas as migrações a partir da V1.
    baseline-on-migrate: true
    baseline-version: 0
  # SMTP dos lembretes por e-mail (ex.: Gmail com senha de app, Brevo, Resend SMTP)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    # Só templates de e-mail; a API não renderiza páginas
    check-template-location: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT Signing Keys do Supabase: https://<ref>.supabase.co/auth/v1/.well-known/jwks.json
          jwk-set-uri: ${SUPABASE_JWKS_URI}
          # https://<ref>.supabase.co/auth/v1
          issuer-uri: ${SUPABASE_ISSUER}
          audiences: authenticated
          jws-algorithms: ES256, RS256

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # SMTP fora do ar não pode derrubar o health check do Render
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
    env:
      show-values: never
    configprops:
      show-values: never

porganization:
  cors:
    # Separe várias origens por vírgula
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}
  cron:
    # Header X-Cron-Secret dos endpoints /internal/**; vazio = sempre 401
    secret: ${CRON_SECRET:}
  mail:
    # Remetente dos e-mails, ex.: "POrganization <avisos@seu-dominio.com>"
    from: ${MAIL_FROM:}
  push:
    # Chaves VAPID do Web Push (gere com: npx web-push generate-vapid-keys); vazias = push desligado
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # Contato do dono do servidor para os push services, ex.: mailto:voce@exemplo.com
    vapid-subject: ${VAPID_SUBJECT:}
  google:
    # OAuth client do Google Cloud (tipo "Aplicativo da Web"), com a Calendar API ativada
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # URL do callback na API, cadastrada no Google: https://<api>/api/integrations/google/callback
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    # Chave AES-256 dos tokens (openssl rand -base64 32)
    token-key: ${GOOGLE_TOKEN_KEY:}
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    revoke-uri: https://oauth2.googleapis.com/revoke
    calendar-api: https://www.googleapis.com/calendar/v3
  # Endereço do app (links dos e-mails e das notificações)
  app-url: ${APP_URL:http://localhost:4200}
